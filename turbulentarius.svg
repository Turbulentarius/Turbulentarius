        <circle cx="2" cy="0" r="18" fill="#247a4b"/>
        <circle cx="21" cy="-9" r="22" fill="#34a865"/>
        <circle cx="42" cy="1" r="18" fill="#288e57"/>
      </g>

      <g transform="translate(816 190)">
        <rect x="17" y="3" width="7" height="32" rx="3" fill="#72502f"/>
        <circle cx="2" cy="0" r="18" fill="#247a4b"/>
        <circle cx="21" cy="-10" r="23" fill="#34a865"/>
        <circle cx="43" cy="1" r="18" fill="#288e57"/>
        <circle cx="22" cy="8" r="19" fill="#2f965d"/>
      </g>

      <g transform="translate(775 204) scale(0.7)">
        <rect x="17" y="3" width="7" height="32" rx="3" fill="#72502f"/>
        <circle cx="2" cy="0" r="18" fill="#247a4b"/>
        <circle cx="21" cy="-9" r="22" fill="#34a865"/>
        <circle cx="42" cy="1" r="18" fill="#288e57"/>
      </g>
    </g>

    <g opacity="0.98">
      <g>
        <animateTransform
          attributeName="transform"
          type="translate"
          values="165 102;171 92;168 97;165 102"
          dur="7s"
          repeatCount="indefinite"/>
        <use href="#balloonPink"/>
      </g>

      <g>
        <animateTransform
          attributeName="transform"
          type="translate"
          values="302 136;308 143;305 132;302 136"
          dur="7.8s"
          repeatCount="indefinite"/>
        <g transform="scale(0.72)">
          <use href="#balloonOrange"/>
        </g>
      </g>

      <g>
        <animateTransform
          attributeName="transform"
          type="translate"
          values="520 91;526 100;522 94;520 91"
          dur="6.7s"
          repeatCount="indefinite"/>
        <g transform="scale(0.78)">
          <use href="#balloonGreen"/>
        </g>
      </g>

      <g>
        <animateTransform
          attributeName="transform"
          type="translate"
          values="692 105;686 94;696 99;692 105"
          dur="6.1s"
          repeatCount="indefinite"/>
        <use href="#balloonRed"/>
      </g>

      <g>
        <animateTransform
          attributeName="transform"
          type="translate"
          values="813 138;819 130;815 142;813 138"
          dur="8.2s"
          repeatCount="indefinite"/>
        <g transform="scale(0.68)">
          <use href="#balloonPurple"/>
        </g>
      </g>
    </g>

    <rect
      x="180"
      y="101"
      width="600"
      height="68"
      rx="34"
      fill="url(#titleShade)"/>

    <text
      x="480"
      y="148"
      text-anchor="middle"
      font-family="Verdana, Arial, sans-serif"
      font-size="60"
      font-weight="700"
      letter-spacing="2"
      fill="#ffffff"
      filter="url(#textGlow)">
