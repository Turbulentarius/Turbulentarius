    <g fill="#ffffff" opacity="0.14">
      <circle cx="185" cy="72" r="17"/>
      <circle cx="207" cy="69" r="23"/>
      <circle cx="232" cy="75" r="15"/>
      <rect x="180" y="72" width="58" height="15" rx="8"/>

      <circle cx="710" cy="68" r="19"/>
      <circle cx="735" cy="65" r="25"/>
      <circle cx="762" cy="71" r="17"/>
      <rect x="706" y="68" width="63" height="16" rx="8"/>
    </g>

    <g>
      <rect x="60" y="184" width="840" height="36" fill="#213f59"/>

      <g fill="#426780">
        <rect x="65" y="155" width="70" height="65"/>
        <rect x="130" y="126" width="58" height="94"/>
        <rect x="184" y="151" width="72" height="69"/>
        <rect x="250" y="137" width="58" height="83"/>
        <rect x="301" y="105" width="78" height="115"/>
        <rect x="370" y="146" width="66" height="74"/>
        <rect x="430" y="118" width="62" height="102"/>
        <rect x="486" y="91" width="84" height="129"/>
        <rect x="561" y="142" width="66" height="78"/>
        <rect x="620" y="111" width="91" height="109"/>
        <rect x="702" y="149" width="64" height="71"/>
        <rect x="758" y="124" width="72" height="96"/>
        <rect x="822" y="158" width="78" height="62"/>
      </g>

      <g fill="#34536b">
        <rect x="83" y="139" width="20" height="16"/>
        <rect x="319" y="93" width="28" height="12"/>
        <rect x="509" y="79" width="34" height="12"/>
        <rect x="648" y="98" width="36" height="13"/>
        <rect x="785" y="111" width="24" height="13"/>
      </g>

      <g fill="#b9d8e7" opacity="0.45">
        <g transform="translate(76 168)">
          <use href="#windows"/>
        </g>

        <g transform="translate(142 141)">
          <use href="#windows"/>
          <use href="#windows" y="18"/>
          <use href="#windows" y="36"/>
        </g>

        <g transform="translate(266 153)">
          <use href="#windows"/>
          <use href="#windows" y="18"/>
        </g>

        <g transform="translate(318 121)">
          <use href="#windows"/>
          <use href="#windows" y="18"/>
          <use href="#windows" y="36"/>
          <use href="#windows" y="54"/>
        </g>

        <g transform="translate(500 108)">
          <use href="#windows"/>
          <use href="#windows" y="18"/>
          <use href="#windows" y="36"/>
          <use href="#windows" y="54"/>
        </g>

        <g transform="translate(639 128)">
          <use href="#windows"/>
          <use href="#windows" y="18"/>
          <use href="#windows" y="36"/>
        </g>

        <g transform="translate(772 142)">
          <use href="#windows"/>
          <use href="#windows" y="18"/>
          <use href="#windows" y="36"/>
        </g>
      </g>
