<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#57b9ff"/>
      <stop offset="100%" stop-color="#2469c8"/>
    </linearGradient>

    <linearGradient id="pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9bd4"/>
      <stop offset="55%" stop-color="#f052c8"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe084"/>
      <stop offset="55%" stop-color="#ff9c35"/>
      <stop offset="100%" stop-color="#f05a1f"/>
    </linearGradient>

    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9af4ce"/>
      <stop offset="55%" stop-color="#3dd6ba"/>
      <stop offset="100%" stop-color="#0f8f9e"/>
    </linearGradient>

    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffafa2"/>
      <stop offset="55%" stop-color="#ff6868"/>
      <stop offset="100%" stop-color="#d9344c"/>
    </linearGradient>

    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ddd2ff"/>
      <stop offset="55%" stop-color="#a779ff"/>
      <stop offset="100%" stop-color="#6335c9"/>
    </linearGradient>

    <linearGradient id="titleShade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#07182b" stop-opacity="0"/>
      <stop offset="18%" stop-color="#07182b" stop-opacity="0.42"/>
      <stop offset="50%" stop-color="#07182b" stop-opacity="0.58"/>
      <stop offset="82%" stop-color="#07182b" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#07182b" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="bannerClip">
      <rect x="60" y="40" width="840" height="180" rx="18"/>
    </clipPath>

    <filter id="textGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <g id="balloonPink">
      <ellipse cx="0" cy="0" rx="30" ry="39" fill="url(#pink)"/>
      <path d="M-20 -12 Q0 12 20 -12" fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="2"/>
      <path d="M-9 -31 V29 M9 -31 V29" fill="none" stroke="#fff" stroke-opacity="0.4" stroke-width="2"/>
      <line x1="-6" y1="33" x2="-8" y2="43" stroke="#f8fafc" stroke-width="1.5"/>
      <line x1="6" y1="33" x2="8" y2="43" stroke="#f8fafc" stroke-width="1.5"/>
      <rect x="-8" y="43" width="16" height="8" rx="2" fill="#8b5e3c"/>
    </g>

    <g id="balloonOrange">
      <ellipse cx="0" cy="0" rx="30" ry="39" fill="url(#orange)"/>
      <path d="M-20 -12 Q0 12 20 -12" fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="2"/>
      <path d="M-9 -31 V29 M9 -31 V29" fill="none" stroke="#fff" stroke-opacity="0.4" stroke-width="2"/>
      <line x1="-6" y1="33" x2="-8" y2="43" stroke="#f8fafc" stroke-width="1.5"/>
      <line x1="6" y1="33" x2="8" y2="43" stroke="#f8fafc" stroke-width="1.5"/>
      <rect x="-8" y="43" width="16" height="8" rx="2" fill="#8b5e3c"/>
    </g>

    <g id="balloonGreen">
      <ellipse cx="0" cy="0" rx="30" ry="39" fill="url(#green)"/>
      <path d="M-20 -12 Q0 12 20 -12" fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="2"/>
      <path d="M-9 -31 V29 M9 -31 V29" fill="none" stroke="#fff" stroke-opacity="0.4" stroke-width="2"/>
      <line x1="-6" y1="33" x2="-8" y2="43" stroke="#f8fafc" stroke-width="1.5"/>
      <line x1="6" y1="33" x2="8" y2="43" stroke="#f8fafc" stroke-width="1.5"/>
      <rect x="-8" y="43" width="16" height="8" rx="2" fill="#8b5e3c"/>
    </g>

    <g id="balloonRed">
      <ellipse cx="0" cy="0" rx="30" ry="39" fill="url(#red)"/>
      <path d="M-20 -12 Q0 12 20 -12" fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="2"/>
      <path d="M-9 -31 V29 M9 -31 V29" fill="none" stroke="#fff" stroke-opacity="0.4" stroke-width="2"/>
      <line x1="-6" y1="33" x2="-8" y2="43" stroke="#f8fafc" stroke-width="1.5"/>
      <line x1="6" y1="33" x2="8" y2="43" stroke="#f8fafc" stroke-width="1.5"/>
      <rect x="-8" y="43" width="16" height="8" rx="2" fill="#8b5e3c"/>
    </g>

    <g id="balloonPurple">
      <ellipse cx="0" cy="0" rx="30" ry="39" fill="url(#purple)"/>
      <path d="M-20 -12 Q0 12 20 -12" fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="2"/>
      <path d="M-9 -31 V29 M9 -31 V29" fill="none" stroke="#fff" stroke-opacity="0.4" stroke-width="2"/>
      <line x1="-6" y1="33" x2="-8" y2="43" stroke="#f8fafc" stroke-width="1.5"/>
      <line x1="6" y1="33" x2="8" y2="43" stroke="#f8fafc" stroke-width="1.5"/>
      <rect x="-8" y="43" width="16" height="8" rx="2" fill="#8b5e3c"/>
    </g>

    <g id="windows">
      <rect x="0" y="0" width="6" height="10" rx="1"/>
      <rect x="14" y="0" width="6" height="10" rx="1"/>
      <rect x="28" y="0" width="6" height="10" rx="1"/>
    </g>
  </defs>

